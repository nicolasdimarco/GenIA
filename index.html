<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GenIA — IA soberana para organizaciones que eligen controlar sus datos y su infraestructura. Open-source, ético y construido por cooperativas." />
    <meta name="theme-color" content="#0a0f1e" />
    <meta property="og:title" content="GenIA">
    <meta property="og:description" content="IA soberana para organizaciones que eligen controlar sus datos y su infraestructura. Open-source, ético y construido por cooperativas.">
    <meta property="og:image" content="https://genia.coop/opengraph.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>GenIA</title>
    <!--
      Decodes the redirect performed by 404.html (spa-github-pages
      technique) back into a real path before the app mounts, so
      client-side routing can pick it up correctly.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Chainlit Copilot -->
    <script src="https://chat.genia.coop/copilot/index.js"></script>
    <script>
      window.addEventListener("chainlit-call-fn", (e) => {
        const { name, args, callback } = e.detail;
        callback("You sent: " + args.msg);
      });
    </script>
    <script>
      window.mountChainlitWidget({
        chainlitServer: "https://chat.genia.coop",
        customCssUrl: "https://chat.genia.coop/public/custom.css",
      });
    </script>
  </body>
</html>
